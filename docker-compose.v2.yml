# NIMS v2 stack (9443) with PostgreSQL
services:
  postgres:
    image: postgres:16-alpine
    container_name: nims-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nims}
      POSTGRES_DB: ${POSTGRES_DB:-nims}
    volumes:
      - nims-v2-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nims} -d ${POSTGRES_DB:-nims}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nims-v2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: nims-v2-app:latest
    container_name: nims-v2-app
    restart: unless-stopped
    volumes:
      - nims-v2-data:/app/packages/nims-server/data
    environment:
      - NODE_ENV=production
      - NIMS_SESSION_SECRET=${NIMS_SESSION_SECRET}
      - NIMS_SESSION_KEY=${NIMS_SESSION_KEY:-nims_v2_sid}
      - NIMS_ADMIN_LOGIN=${NIMS_ADMIN_LOGIN:-admin}
      - NIMS_ADMIN_PASS=${NIMS_ADMIN_PASS:-}
      - NIMS_ENSURE_ADMIN=${NIMS_ENSURE_ADMIN:-0}
      - NIMS_COOKIE_SECURE=${NIMS_COOKIE_SECURE:-1}
      - NIMS_STORAGE=${NIMS_STORAGE:-postgres}
      - NIMS_PROJECT_SLUG=${NIMS_PROJECT_SLUG:-main}
      - DATABASE_URL=${DATABASE_URL:-postgres://nims:nims@postgres:5432/nims}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - nims-v2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nims-v2-nginx
    restart: unless-stopped
    ports:
      - "${NIMS_HTTPS_PORT:-9443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - larp-rules_certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - nims-v2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nims-v2-data:
    name: nims-v2-data
  nims-v2-pg:
    name: nims-v2-pg
  larp-rules_certbot_conf:
    external: true

networks:
  nims-v2:
    name: nims-v2-net
